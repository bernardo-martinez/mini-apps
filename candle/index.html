
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#100e19">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Velitas">
<title>Velitas 🕯️</title>

<style>
* {
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

body {
  margin: 0;
  min-height: 100vh;
  min-height: 100dvh;
  padding: max(25px, env(safe-area-inset-top)) 20px
           max(25px, env(safe-area-inset-bottom));
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  overflow: hidden;
  background:
    radial-gradient(
      ellipse at 50% 48%,
      #493044 0%,
      #21182c 48%,
      #100e19 100%
    );
  color: white;
  font-family: -apple-system, BlinkMacSystemFont, sans-serif;
}

h1 {
  margin: 0 0 9px;
  font-size: 28px;
  font-weight: 400;
  letter-spacing: 2px;
  text-align: center;
}

.subtitle {
  color: #c8b8ca;
  font-size: 12px;
  letter-spacing: 2px;
  text-align: center;
}

/* Candle scene */

.scene {
  position: relative;
  width: 100%;
  height: 330px;
  display: flex;
  align-items: flex-end;
  justify-content: center;
  margin-top: 35px;
  margin-bottom: 20px;
}

.candle {
  position: relative;
  width: 76px;
  height: 180px;
  border-radius: 9px 9px 6px 6px;
  background: linear-gradient(
    90deg,
    #9c574c,
    #e8ae87 28%,
    #ffe0b5 52%,
    #d78c69 100%
  );
  box-shadow:
    0 10px 30px #0005,
    inset -5px 0 10px #a45b4533;
  z-index: 2;
  cursor: pointer;
}

.candle::before {
  content: "";
  position: absolute;
  top: -5px;
  left: 0;
  width: 100%;
  height: 13px;
  border-radius: 50%;
  background: #ffe7c7;
}

.wick {
  position: absolute;
  top: -17px;
  left: 36px;
  width: 4px;
  height: 17px;
  background: #39251d;
  border-radius: 3px;
  z-index: 3;
}

/* Flame */

.flame {
  --lean: 0deg;

  position: absolute;
  width: 38px;
  height: 65px;
  top: -78px;
  left: 19px;
  transform-origin: 50% 90%;
  border-radius: 50% 50% 35% 35%;
  background: radial-gradient(
    ellipse at 50% 75%,
    #fffbd0 0%,
    #ffe36d 25%,
    #ffad27 55%,
    #ff641b 80%,
    transparent 100%
  );
  filter: drop-shadow(0 0 15px #ffac36);
  animation: flicker .15s infinite alternate;
  transition:
    opacity .55s,
    filter .3s;
}

.flame::after {
  content: "";
  position: absolute;
  width: 15px;
  height: 31px;
  left: 12px;
  top: 25px;
  border-radius: 50%;
  background: #fff8c9;
  filter: blur(2px);
}

@keyframes flicker {
  0% {
    transform:
      rotate(calc(var(--lean) - 4deg))
      scale(.95, 1.04);
  }

  100% {
    transform:
      rotate(calc(var(--lean) + 4deg))
      scale(1.05, .96);
  }
}

.flame.off {
  opacity: 0;
  filter: none;
  animation: none;
}

/* Smoke */

.smoke {
  position: absolute;
  top: -40px;
  left: 28px;
  width: 20px;
  height: 20px;
  border-radius: 50%;
  background: #dddce5;
  filter: blur(7px);
  opacity: 0;
  pointer-events: none;
}

.smoke.animate {
  animation: smoke 2.8s ease-out forwards;
}

@keyframes smoke {
  0% {
    opacity: .7;
    transform: translate(0, 0) scale(.4);
  }

  40% {
    opacity: .4;
    transform: translate(-10px, -45px) scale(1.8);
  }

  100% {
    opacity: 0;
    transform: translate(15px, -120px) scale(3);
  }
}

/* Candle glow */

.glow {
  position: absolute;
  bottom: 5px;
  width: 190px;
  height: 55px;
  border-radius: 50%;
  background: #ff9b38;
  filter: blur(45px);
  opacity: .4;
  transition: opacity .7s;
}

.glow.off {
  opacity: 0;
}

/* Small microphone control */

.controls {
  width: 100%;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 12px;
}

.mic-setting {
  border: none;
  background: transparent;
  color: #b9a9c5;
  box-shadow: none;
  padding: 9px 15px;
  font-size: 12px;
  font-weight: 400;
  letter-spacing: .5px;
  opacity: .8;
  cursor: pointer;
}

.mic-setting:active {
  transform: scale(.97);
}

.mic-setting:disabled {
  opacity: .45;
}

#status {
  font-size: 13px;
  color: #e2cfdf;
  text-align: center;
  min-height: 20px;
}

.meter {
  width: 130px;
  height: 4px;
  border-radius: 5px;
  background: #ffffff22;
  overflow: hidden;
}

#level {
  height: 100%;
  width: 0%;
  background: #ffd18c;
  transition: width .08s;
}

.hint {
  color: #a99aaf;
  font-size: 10px;
  letter-spacing: 1.5px;
  text-align: center;
}

@media (max-height: 700px) {
  .scene {
    height: 265px;
    margin-top: 15px;
  }

  .candle {
    height: 155px;
  }
}

</style>
</head>

<body>
<div class="scene">

  <div class="glow" id="glow"></div>

  <div class="candle" id="candle">
    <div class="wick"></div>
    <div class="flame" id="flame"></div>
    <div class="smoke" id="smoke"></div>
  </div>

</div>

<div class="controls">


  <div class="meter">
    <div id="level"></div>
  </div>

  <button id="micButton" class="mic-setting">
    🎤
  </button>

</div>

<script>

const flame = document.getElementById("flame");
const smoke = document.getElementById("smoke");
const glow = document.getElementById("glow");
const candle = document.getElementById("candle");
const button = document.getElementById("micButton");
const status = document.getElementById("status");
const level = document.getElementById("level");

let audioContext = null;
let stream = null;
let analyser = null;
let animationId = null;

let blowingSince = null;
let noiseFloor = 0.008;

let extinguished = false;
let starting = false;
let listening = false;

let micSession = 0;
let calibrationStart = 0;


// --------------------------------
// ENABLE MICROPHONE
// --------------------------------

async function enableMic() {

  if (starting || listening || extinguished) return;

  starting = true;
  button.disabled = true;

  const thisSession = ++micSession;

  try {

    status.textContent = "Requesting microphone permission...";

    if (!navigator.mediaDevices ||
        !navigator.mediaDevices.getUserMedia) {

      throw new Error("Microphone requires HTTPS.");
    }

    const newStream =
      await navigator.mediaDevices.getUserMedia({
        audio: {
          echoCancellation: false,
          noiseSuppression: false,
          autoGainControl: false
        }
      });

    if (thisSession !== micSession || document.hidden) {

      newStream.getTracks().forEach(track => track.stop());

      starting = false;
      return;
    }

    stream = newStream;

    audioContext = new (
      window.AudioContext ||
      window.webkitAudioContext
    )();

    await audioContext.resume();

    if (thisSession !== micSession || document.hidden) {

      stopMicrophone();
      starting = false;
      return;
    }

    const source =
      audioContext.createMediaStreamSource(stream);

    const filter = audioContext.createBiquadFilter();

    filter.type = "highpass";
    filter.frequency.value = 250;

    analyser = audioContext.createAnalyser();

    analyser.fftSize = 2048;
    analyser.smoothingTimeConstant = 0.2;

    source.connect(filter);
    filter.connect(analyser);

    noiseFloor = 0.008;
    blowingSince = null;
    calibrationStart = performance.now();

    listening = true;
    starting = false;

    status.textContent = "Listening! Make a wish and blow 💨";

    button.textContent = "✓ Microphone enabled";
    button.disabled = false;

    listen();

  } catch (error) {

    console.error(error);

    if (thisSession === micSession) {

      status.textContent =
        error.name + ": " + error.message;

      button.textContent = "🎤 Try again";
      button.disabled = false;

      stopMicrophone();
    }

    starting = false;
  }
}


// --------------------------------
// LISTEN FOR BREATH
// --------------------------------

function listen() {

  if (!analyser || !listening || extinguished) return;

  const data = new Float32Array(analyser.fftSize);

  // Sensitivity settings
  const MIN_BLOW_LEVEL = 0.018;
  const BLOW_MULTIPLIER = 1.8;
  const BLOW_DURATION = 120;

  function checkSound() {

    if (!analyser || !listening || extinguished) return;

    analyser.getFloatTimeDomainData(data);

    let sum = 0;

    for (let i = 0; i < data.length; i++) {
      sum += data[i] * data[i];
    }

    const volume = Math.sqrt(sum / data.length);

    const now = performance.now();

    // Microphone meter
    level.style.width =
      Math.min(100, volume * 1000) + "%";

    // Learn background noise gradually
    if (volume < Math.max(MIN_BLOW_LEVEL, noiseFloor * 2)) {

      noiseFloor =
        noiseFloor * 0.97 + volume * 0.03;
    }

    const threshold = Math.max(
      MIN_BLOW_LEVEL,
      noiseFloor * BLOW_MULTIPLIER
    );

    // Lean flame according to breath strength
    const strength = Math.max(
      0,
      Math.min(1, (volume - threshold) / 0.09)
    );

    const lean = strength * 32;

    flame.style.setProperty(
      "--lean",
      lean.toFixed(1) + "deg"
    );

    // Allow microphone to settle before detection
    if (now - calibrationStart > 500) {

      if (volume > threshold) {

        if (blowingSince === null) {
          blowingSince = now;
        }

        if (now - blowingSince >= BLOW_DURATION) {

          blowOut();
          return;
        }

      } else {

        blowingSince = null;
        flame.style.setProperty("--lean", "0deg");

      }
    }

    animationId = requestAnimationFrame(checkSound);
  }

  checkSound();
}


// --------------------------------
// EXTINGUISH CANDLE
// --------------------------------

function blowOut() {

  if (extinguished) return;

  extinguished = true;

  flame.classList.add("off");
  glow.classList.add("off");

  smoke.classList.remove("animate");

  // Restart smoke animation
  void smoke.offsetWidth;

  smoke.classList.add("animate");

  status.textContent =
    "Your wish is on its way... ✨";

  level.style.width = "0%";

  // IMPORTANT:
  // Do not stop the microphone here.
  // It stays enabled for the next wish.

  if (animationId !== null) {
    cancelAnimationFrame(animationId);
    animationId = null;
  }
}


// --------------------------------
// RELIGHT CANDLE
// --------------------------------

async function relight() {

  if (!extinguished) return;

  extinguished = false;

  flame.classList.remove("off");
  glow.classList.remove("off");
  smoke.classList.remove("animate");

  flame.style.setProperty("--lean", "0deg");

  if (stream && analyser && audioContext) {

    try {

      if (audioContext.state !== "running") {
        await audioContext.resume();
      }

      if (document.hidden || extinguished) return;

      listening = true;
      blowingSince = null;
      calibrationStart = performance.now();

      status.textContent = "Make another wish! Blow! 💨";

      listen();

    } catch (error) {

      console.error(error);

      status.textContent =
        "Tap the microphone setting to reconnect.";

    }

  } else {

    status.textContent = "Make another wish! ✨";

  }
}


// --------------------------------
// STOP MICROPHONE
// --------------------------------

function stopMicrophone() {

  micSession++;

  if (animationId !== null) {

    cancelAnimationFrame(animationId);
    animationId = null;
  }

  if (stream) {

    stream.getTracks().forEach(track => track.stop());
    stream = null;
  }

  if (audioContext) {

    const oldContext = audioContext;
    audioContext = null;

    oldContext.close().catch(console.error);
  }

  analyser = null;
  listening = false;
  blowingSince = null;

  level.style.width = "0%";

  flame.style.setProperty("--lean", "0deg");
}


// --------------------------------
// MICROPHONE BUTTON
// --------------------------------

button.addEventListener("click", async () => {

  if (starting) return;

  if (listening) {

    stopMicrophone();

    button.textContent = "🎤 Enable microphone";

    status.textContent =
      "Microphone turned off.";

    return;
  }

  if (extinguished) {

    await relight();
    return;
  }

  if (!stream) {

    await enableMic();
  }

});


// --------------------------------
// TAP CANDLE TO RELIGHT
// --------------------------------

candle.addEventListener("click", () => {

  if (extinguished) {
    relight();
  }

});


// --------------------------------
// STOP MIC WHEN LEAVING APP
// --------------------------------

function handlePageHidden() {

  if (document.hidden) {

    stopMicrophone();

    starting = false;

    if (!extinguished) {

      button.textContent = "🎤 Enable microphone";

      status.textContent =
        "Microphone paused. Welcome back! ✨";
    }

  }
}

document.addEventListener(
  "visibilitychange",
  handlePageHidden
);

window.addEventListener("pagehide", () => {

  stopMicrophone();
  starting = false;

});

</script>

</body>
</html>
