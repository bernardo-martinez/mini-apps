
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#171323">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Mini Apps</title>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      padding: 45px 22px;
      font-family: -apple-system, sans-serif;
      color: white;
      background: #171323;
    }

    h1 {
      font-size: 32px;
      margin-bottom: 8px;
    }

    .subtitle {
      color: #aaa0bd;
      margin-bottom: 32px;
    }

    .apps {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 16px;
    }

    .app {
      display: block;
      padding: 22px 16px;
      min-height: 155px;
      border-radius: 20px;
      background: #292139;
      color: white;
      text-decoration: none;
      border: 1px solid #40344f;
    }

    .emoji {
      font-size: 38px;
      margin-bottom: 18px;
    }

    .name {
      font-size: 17px;
      font-weight: 600;
    }

    .description {
      font-size: 12px;
      color: #b9accb;
      margin-top: 6px;
    }

    .coming {
      opacity: 0.65;
    }
  </style>
</head>
<body>
  <h1>My Little Apps ✨</h1>
  <div class="subtitle">A little collection of useful things.</div>

  <div class="apps">
    <a class="app" href="candle/">
      <div class="emoji">🕯️</div>
      <div class="name">Velitas</div>
      <div class="description">Blow out the flame</div>
    </a>

    <div class="app coming">
      <div class="emoji">⏱️</div>
      <div class="name">Focus Timer</div>
      <div class="description">Coming soon</div>
    </div>

    <div class="app coming">
      <div class="emoji">🎲</div>
      <div class="name">Random Dice</div>
      <div class="description">Coming soon</div>
    </div>

    <div class="app coming">
      <div class="emoji">💡</div>
      <div class="name">New Ideas</div>
      <div class="description">More little apps</div>
    </div>
  </div>
</body>
</html>
